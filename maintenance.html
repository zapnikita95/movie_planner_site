<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <title>Movie Planner — технические работы</title>
  <link rel="icon" href="https://cdn.jsdelivr.net/gh/zapnikita95/movie_planner_site@main/favicon.ico">
  <style>
    :root {
      --bg: #09090b;
      --surface: #131318;
      --text: #f4f4f5;
      --body: #e4e4ec;
      --muted: #b4b4be;
      --accent: #ff7eb6;
      --cta-a: #c2185b;
      --cta-b: #6d28d9;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      min-height: 100%;
      background: var(--bg);
      color: var(--body);
      font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    .wrap {
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: max(24px, env(safe-area-inset-top)) 20px max(24px, env(safe-area-inset-bottom));
      text-align: center;
    }
    .card {
      width: 100%;
      max-width: 420px;
      background: linear-gradient(165deg, rgba(26,26,34,.96), rgba(9,9,11,.98));
      border: 1px solid rgba(255,255,255,.08);
      border-radius: 16px;
      padding: 28px 22px 24px;
      box-shadow: 0 24px 80px rgba(0,0,0,.45);
    }
    .brand {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-bottom: 20px;
      font-family: 'Unbounded', Inter, sans-serif;
      font-weight: 800;
      font-size: 1.05rem;
      letter-spacing: -0.03em;
      color: var(--text);
    }
    .brand img {
      width: 28px;
      height: 28px;
      border-radius: 6px;
    }
    h1 {
      margin: 0 0 12px;
      font-family: 'Unbounded', Inter, sans-serif;
      font-weight: 800;
      font-size: clamp(1.35rem, 4.5vw, 1.65rem);
      line-height: 1.2;
      letter-spacing: -0.03em;
      color: var(--text);
    }
    p {
      margin: 0 0 14px;
      font-size: 1rem;
      line-height: 1.55;
      color: var(--body);
    }
    .muted {
      font-size: 0.92rem;
      color: var(--muted);
      margin-bottom: 0;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-top: 18px;
      min-height: 44px;
      padding: 0 20px;
      border: 0;
      border-radius: 999px;
      background: linear-gradient(135deg, var(--cta-a), var(--cta-b));
      color: #fff;
      font-weight: 700;
      font-size: 0.95rem;
      text-decoration: none;
      cursor: pointer;
    }
    .btn:hover { filter: brightness(1.06); }
    .pulse {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--accent);
      margin: 0 auto 16px;
      box-shadow: 0 0 0 0 rgba(255, 126, 182, .55);
      animation: pulse 1.8s ease-out infinite;
    }
    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(255, 126, 182, .45); }
      70% { box-shadow: 0 0 0 14px rgba(255, 126, 182, 0); }
      100% { box-shadow: 0 0 0 0 rgba(255, 126, 182, 0); }
    }
    @media (prefers-reduced-motion: reduce) {
      .pulse { animation: none; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <div class="brand">
        <img src="https://cdn.jsdelivr.net/gh/zapnikita95/movie_planner_site@main/images/logo-192.png" alt="" width="28" height="28" onerror="this.style.display='none'">
        <span>Movie Planner</span>
      </div>
      <div class="pulse" aria-hidden="true"></div>
      <h1>Сайт на техническом обслуживании</h1>
      <p>Мы уже чиним. Зайдите чуть позже — обычно это занимает несколько минут.</p>
      <p class="muted">Списки фильмов и кабинет скоро снова будут доступны.</p>
      <button type="button" class="btn" onclick="location.reload()">Обновить страницу</button>
    </div>
  </div>
</body>
</html>

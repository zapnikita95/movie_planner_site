<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Search baseline — AI = text</title>
  <style>
    body {
      margin: 0; min-height: 100vh; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 16px;
      background: #09090b; color: #f4f4f5;
      font-family: system-ui, -apple-system, sans-serif; padding: 24px;
    }
    h1 { font-size: 13px; color: #b4b4be; margin: 0; text-align: center; max-width: 380px; }
    .bar {
      display: flex; flex-direction: row; align-items: center;
      width: min(360px, 100%); min-height: 48px;
      background: #1a1a22; border: 1px solid #2a2a38; border-radius: 14px;
      padding: 0 6px 0 4px; box-sizing: border-box;
    }
    .icon {
      width: 36px; height: 40px; display: flex; align-items: center; justify-content: center;
      flex-shrink: 0; color: #f4f4f5; background: transparent; border: 0; padding: 0;
    }
    .mid {
      flex: 1; min-width: 0;
      display: flex; flex-direction: row; align-items: baseline;
      padding: 14px 4px 14px 0;
    }
    .ph {
      flex: 1; min-width: 0; border: 0; background: transparent;
      color: #666; font-size: 16px; line-height: 20px; padding: 0; margin: 0; outline: none;
    }
    .ai {
      flex-shrink: 0; border: 0; background: transparent;
      color: #f4f4f5; font-size: 12px; font-weight: 700; letter-spacing: 0.4px;
      line-height: 20px; /* SAME as .ph → shared baseline */
      padding: 0 8px 0 4px; margin: 0; cursor: default;
    }
    svg { display: block; width: 18px; height: 18px; }
    .note { font-size: 12px; color: #b4b4be; text-align: center; max-width: 380px; }
  </style>
</head>
<body>
  <h1>AI и «Найти фильм…» — один baseline (align-items: baseline + один line-height). Камера = микрофон. Без кружков.</h1>
  <div class="bar">
    <span class="icon" aria-hidden="true">
      <svg viewBox="0 0 256 256" fill="currentColor"><path d="M229.66,218.34l-50.07-50.06a88.11,88.11,0,1,0-11.31,11.31l50.06,50.07a8,8,0,0,0,11.32-11.32ZM40,112a72,72,0,1,1,72,72A72.08,72.08,0,0,1,40,112Z"/></svg>
    </span>
    <div class="mid">
      <input class="ph" value="Найти фильм или сериал" readonly />
      <button type="button" class="ai">AI</button>
    </div>
    <button type="button" class="icon" title="camera">
      <svg viewBox="0 0 256 256" fill="currentColor"><path d="M208,56H180.28L166.65,35.56A8,8,0,0,0,160,32H96a8,8,0,0,0-6.65,3.56L75.71,56H48A24,24,0,0,0,24,80V192a24,24,0,0,0,24,24H208a24,24,0,0,0,24-24V80A24,24,0,0,0,208,56Zm8,136a8,8,0,0,1-8,8H48a8,8,0,0,1-8-8V80a8,8,0,0,1,8-8H80a8,8,0,0,0,6.66-3.56L100.28,48h55.43l13.63,20.44A8,8,0,0,0,176,72h32a8,8,0,0,1,8,8ZM128,88a44,44,0,1,0,44,44A44.05,44.05,0,0,0,128,88Zm0,72a28,28,0,1,1,28-28A28,28,0,0,1,128,160Z"/></svg>
    </button>
    <button type="button" class="icon" title="mic">
      <svg viewBox="0 0 256 256" fill="currentColor"><path d="M128,176a48.05,48.05,0,0,0,48-48V64a48,48,0,0,0-96,0v64A48.05,48.05,0,0,0,128,176ZM96,64a32,32,0,0,1,64,0v64a32,32,0,0,1-64,0Zm40,143.83V232a8,8,0,0,1-16,0V207.83A80.09,80.09,0,0,1,48,128a8,8,0,0,1,16,0,64,64,0,0,0,128,0,8,8,0,0,1,16,0A80.09,80.09,0,0,1,136,207.83Z"/></svg>
    </button>
  </div>
  <p class="note">Розовую линию не рисую — baseline задаёт сам flex. Если AI сидит на линии букв «Найти…» — ок.</p>
</body>
</html>

<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>T-Афиша demo</title>
  <link rel="stylesheet" href="../style-v2.css?v=demo-tafisha3" />
  <style>
    body { margin: 0; min-height: 100vh; background: #09090b; color: #f4f4f5; font-family: system-ui, sans-serif; }
    .demo-wrap { max-width: 520px; margin: 0 auto; padding: 24px 16px 48px; }
    .demo-wrap h1 { font-size: 18px; margin: 0 0 8px; }
    .demo-wrap p { margin: 0 0 20px; color: #b4b4be; font-size: 14px; line-height: 1.45; }
    .demo-card { border: 1px solid rgba(255,255,255,.08); border-radius: 16px; padding: 16px; background: rgba(19,19,24,.85); }
    .demo-card + .demo-card { margin-top: 16px; }
    .demo-label { font-size: 12px; color: #b4b4be; margin-bottom: 12px; }
    .glass-cta-stage { width: 100%; min-width: 0; }
    .glass-cta {
      width: 100%; min-height: 56px; border: 0; border-radius: 18px;
      display: inline-flex; align-items: center; justify-content: center; gap: 10px;
      padding: 0 22px; background: linear-gradient(135deg, rgba(255,255,255,.12), rgba(255,255,255,.04));
      color: #fff; font-size: 16px; font-weight: 500;
    }
    .demo-poster {
      position: relative; aspect-ratio: 2/3; max-width: 280px; margin: 0 auto;
      border-radius: 14px; overflow: hidden;
      background: linear-gradient(160deg, #1a1a22, #09090b);
    }
    @media (max-width: 860px) { .demo-desktop { display: none; } }
    @media (min-width: 861px) { .demo-mobile { display: none; } }
  </style>
</head>
<body class="film-standalone-page">
  <div class="demo-wrap">
    <h1>T-Афиша · «Билеты»</h1>
    <p>Мобилка: оверлей на постере справа снизу. Десктоп: grid слева от «В список просмотра» без наезда.</p>

    <div class="demo-card demo-mobile">
      <div class="demo-label">Mobile poster</div>
      <div class="demo-poster poster-wrap">
        <a class="film-poster-t-afisha-cta" href="#" onclick="return false;">
          <span class="film-t-afisha-btn__icon" aria-hidden="true">
            <img src="../images/partners/tbank-afisha-t.svg" alt="" width="18" height="22" />
          </span>
          <span class="film-t-afisha-btn__label">Билеты</span>
        </a>
      </div>
    </div>

    <div class="demo-card demo-desktop">
      <div class="demo-label">Desktop toolbar</div>
      <div class="film-page-toolbar film-page-toolbar--guest">
        <div class="film-toolbar-plan-wrap">
          <a class="film-t-afisha-btn" href="#" onclick="return false;">
            <span class="film-t-afisha-btn__icon" aria-hidden="true">
              <img src="../images/partners/tbank-afisha-t.svg" alt="" width="18" height="22" />
            </span>
            <span class="film-t-afisha-btn__label">Билеты</span>
          </a>
          <div class="glass-cta-stage">
            <button type="button" class="glass-cta">
              <span>В список просмотра</span>
              <span style="opacity:.7">Войти</span>
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
